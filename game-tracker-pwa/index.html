<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Family Game Shelf</title>
<meta name="description" content="Track your family's board games, search the shelf, and keep score during game night." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Game Shelf" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="css/styles.css" />

<!-- QR code generator, used for household invite codes. Loaded from CDN; the
     service worker caches it after first successful load so invites still
     render while offline on subsequent visits. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1>🎲 Family Game Shelf</h1>
        <div class="sub">Your household's game collection</div>
      </div>
    </header>
    <main class="view" id="view"></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
